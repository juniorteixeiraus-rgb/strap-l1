# Cargo configuration for Strap L1 — Proof-of-Useful-Work blockchain

[package]
name = "strap"
version = "0.1.0"
edition = "2021"
description = "Strap L1 PoUW Blockchain — Rust chain core + C++ PoUW verifier"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
cmake = "0.1.58"

[[bin]]
name = "strap"
path = "src/main.rs"
